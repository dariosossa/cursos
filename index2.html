<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Profesional de Cursos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; font-family: sans-serif; }
        #media-layer { transition: transform 0.2s ease-out; transform-origin: center center; }
        
        /* Controles de Dibujo y Panning */
        #draw-canvas { pointer-events: auto; z-index: 20; position: absolute; top:0; left:0; width:100%; height:100%; touch-action: none; cursor: grab; }
        body.drawing-active #draw-canvas { cursor: crosshair; }
        body.erasing-active #draw-canvas { cursor: cell; }
        body.panning #draw-canvas { cursor: grabbing; }
        
        .chapter-item.active { border-left: 4px solid #ef4444; background: rgba(255,255,255,0.1); }
        #sidebar-content h3, #sidebar-content span { color: #ffffff !important; }
        
        #progress-container { height: 6px; background: rgba(255, 255, 255, 0.2); cursor: pointer; position: relative; transition: height 0.1s; }
        #progress-container:hover { height: 10px; }
        #progress-bar { height: 100%; background: #ef4444; width: 0%; position: absolute; pointer-events: none; transition: width 0.1s linear;}
        
        /* Ajustes YouTube */
        #yt-container iframe { width: 100%; height: 100%; pointer-events: none; }
        
        /* Ocultar barra de desplazamiento en el sidebar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }

        /* Estados de los botones */
        .tool-btn.active { color: #ef4444; background: rgba(239, 68, 68, 0.2); border-radius: 50%; }
        .tool-btn { padding: 0.5rem; transition: all 0.2s; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;}
    </style>
</head>
<body class="h-screen w-screen flex overflow-hidden text-white">

    <!-- Menú Lateral (Sidebar) -->
    <div id="sidebar-menu" class="absolute top-0 left-0 h-full w-[300px] bg-[#18181b] z-40 transform -translate-x-full transition-transform duration-300 border-r border-white/10 flex flex-col shadow-2xl">
        <div class="p-4 flex justify-between items-center text-white border-b border-white/10">
            <h2 class="font-bold text-lg"><i class="fa-solid fa-graduation-cap text-red-500 mr-2"></i>Contenido</h2>
            <button id="close-sidebar" class="hover:text-red-500 transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="sidebar-content" class="flex-1 overflow-y-auto p-2">
            <!-- El contenido se inyecta por JS -->
        </div>
    </div>

    <!-- Contenedor Principal de Video -->
    <div id="video-container" class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
        
        <!-- Botón para abrir menú (visible si el menú está cerrado) -->
        <button id="sidebar-toggle" class="absolute top-4 left-4 text-white hover:text-red-500 transition-colors text-2xl z-30 drop-shadow-md">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Capa Media (Video + Canvas) -->
        <div id="media-layer" class="w-full h-full flex items-center justify-center relative">
            <!-- Reproductor HTML5 para MP4 -->
            <video id="main-video" class="w-full h-full object-contain hidden" playsinline></video>
            
            <!-- Reproductor de YouTube -->
            <div id="yt-container" class="w-full h-full hidden pointer-events-none flex items-center justify-center">
                <div id="yt-player" class="w-full h-full pointer-events-auto"></div>
            </div>

            <!-- Capa de dibujo superpuesta -->
            <canvas id="draw-canvas"></canvas>
        </div>

        <!-- Barra de Controles Inferior -->
        <div class="absolute bottom-0 w-full bg-gradient-to-t from-black via-black/80 to-transparent z-50 px-6 py-4 pt-12">
            
            <!-- Tiempos -->
            <div class="flex justify-between text-gray-300 text-[11px] mb-2 font-mono font-medium tracking-wide">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>
            
            <!-- Barra de Progreso -->
            <div id="progress-container" class="w-full mb-4 rounded-full overflow-hidden shadow-lg shadow-black/50">
                <div id="progress-bar"></div>
            </div>
            
            <!-- Botonera -->
            <div class="flex items-center justify-between">
                
                <div class="flex items-center gap-6">
                    <button id="play-btn" class="text-2xl hover:text-red-500 transition-colors transform hover:scale-110"><i class="fa-solid fa-play"></i></button>
                    
                    <!-- Control de Volumen (Opcional, añadido para completitud) -->
                    <div class="flex items-center gap-2 group">
                        <i class="fa-solid fa-volume-high text-sm text-gray-400"></i>
                        <input id="volume-slider" type="range" min="0" max="100" value="100" class="w-20 accent-red-500 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>

                <div class="flex items-center gap-4 bg-white/5 px-4 py-2 rounded-2xl backdrop-blur-sm border border-white/10">
                    <!-- Zoom -->
                    <div class="flex items-center gap-2 mr-2 border-r border-white/20 pr-4">
                        <i class="fa-solid fa-magnifying-glass-minus text-xs text-gray-400"></i>
                        <input id="zoom-slider" type="range" min="1" max="10" step="0.1" value="1" class="w-24 accent-red-500 h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                        <i class="fa-solid fa-magnifying-glass-plus text-xs text-gray-400"></i>
                        <span id="zoom-val" class="text-xs font-mono ml-2 w-8">1.0x</span>
                    </div>

                    <!-- Herramientas de dibujo -->
                    <button id="draw-mode-btn" class="tool-btn" title="Dibujar (D)"><i class="fa-solid fa-paintbrush"></i></button>
                    <button id="erase-mode-btn" class="tool-btn" title="Borrar (B)"><i class="fa-solid fa-eraser"></i></button>
                    <div class="h-6 w-px bg-white/20 mx-1"></div>
                    <button id="draw-clear" class="text-xs font-semibold text-gray-300 hover:text-red-400 transition-colors uppercase tracking-wider" title="Limpiar Todo">Limpiar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATOS DEL CURSO ---
        const themes = [
            { name: "Unidad 1: Introducción", videos: [
                { title: "Mi Video Seleccionado", src: "https://youtu.be/Y-GQRBbPwAQ", poster: "https://img.youtube.com/vi/Y-GQRBbPwAQ/mqdefault.jpg" },
                { title: "HTML Estructura Básica (MP4)", src: "https://www.w3schools.com/html/mov_bbb.mp4", poster: "https://picsum.photos/seed/1/200/100" }
            ]},
            { name: "Unidad 2: Conceptos Avanzados", videos: [
                { title: "Animación Blender (YouTube)", src: "https://www.youtube.com/watch?v=YE7VzlLtp-4", poster: "https://img.youtube.com/vi/YE7VzlLtp-4/mqdefault.jpg" },
                { title: "Video Local Secundario (MP4)", src: "https://media.w3.org/2010/05/sintel/trailer.mp4", poster: "https://picsum.photos/seed/3/200/100" }
            ]}
        ];

        // --- 2. REFERENCIAS DOM ---
        const video = document.getElementById('main-video');
        const videoContainer = document.getElementById('video-container');
        const ytContainer = document.getElementById('yt-container');
        const mediaLayer = document.getElementById('media-layer');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        
        // Controles de progreso y tiempo
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const curTimeEl = document.getElementById('current-time');
        const durTimeEl = document.getElementById('total-duration');
        
        // Botones
        const playBtn = document.getElementById('play-btn');
        const playIcon = playBtn.querySelector('i');
        const volumeSlider = document.getElementById('volume-slider');
        const zoomSlider = document.getElementById('zoom-slider');
        const zoomVal = document.getElementById('zoom-val');
        
        // Sidebar
        const sidebarMenu = document.getElementById('sidebar-menu');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const sidebarContent = document.getElementById('sidebar-content');

        // Herramientas
        const drawBtn = document.getElementById('draw-mode-btn');
        const eraseBtn = document.getElementById('erase-mode-btn');
        const clearBtn = document.getElementById('draw-clear');

        // --- 3. VARIABLES DE ESTADO ---
        let currentZoom = 1;
        let isDrawingMode = false;
        let isErasingMode = false;
        let currentMediaType = 'mp4'; 
        let isPlaying = false;
        
        // Estado del dibujo
        let isMouseDown = false;
        let lastX = 0, lastY = 0;

        // Estado de Paneo (Arrastrar)
        let panX = 0, panY = 0;
        let isPanning = false;

        // YouTube API
        let ytPlayer = null;
        let isYtReady = false;
        let ytTrackerInterval = null;
        let pendingVideoLoad = null; // Guarda el video a cargar si la API aún no está lista

        // --- 4. INICIALIZACIÓN DE LA INTERFAZ ---
        
        // Construir Menú
        themes.forEach((theme, themeIndex) => {
            const themeTitle = document.createElement('h3');
            themeTitle.className = "text-gray-400 text-xs font-bold uppercase mt-6 mb-2 ml-2 tracking-wider";
            themeTitle.innerText = theme.name;
            sidebarContent.appendChild(themeTitle);
            
            theme.videos.forEach((vid, vidIndex) => {
                const item = document.createElement('div');
                item.className = "chapter-item p-2 mb-1 rounded-lg cursor-pointer hover:bg-white/10 flex items-center gap-3 transition-all border border-transparent hover:border-white/5";
                item.innerHTML = `
                    <div class="relative w-20 h-12 flex-shrink-0">
                        <img src="${vid.poster}" class="w-full h-full object-cover rounded-md shadow-md">
                        <div class="absolute inset-0 bg-black/20 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity rounded-md">
                            <i class="fa-solid fa-play text-white/80 text-xs"></i>
                        </div>
                    </div>
                    <span class="text-sm truncate text-gray-200 font-medium">${vid.title}</span>
                `;
                item.onclick = () => loadMedia(vid, item);
                sidebarContent.appendChild(item);

                // Auto cargar el primer video
                if(themeIndex === 0 && vidIndex === 0) {
                    // Retrasamos un frame para que el DOM esté listo
                    setTimeout(() => loadMedia(vid, item), 0);
                    item.classList.add('active');
                }
            });
        });

        // Alternar Menú
        sidebarToggle.onclick = () => sidebarMenu.classList.remove('-translate-x-full');
        closeSidebarBtn.onclick = () => sidebarMenu.classList.add('-translate-x-full');

        // --- 5. LÓGICA DE YOUTUBE ---

        // Inyectar API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function extractYouTubeID(url) {
            if (!url) return null;
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }

        window.onYouTubeIframeAPIReady = function() {
            isYtReady = true;
            if (pendingVideoLoad) {
                loadMedia(pendingVideoLoad.videoData, pendingVideoLoad.element);
                pendingVideoLoad = null;
            }
        };

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                updatePlayIcon();
                startYtTracker();
                // Obtener duración si no se ha cargado
                durTimeEl.innerText = formatTime(ytPlayer.getDuration());
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                isPlaying = false;
                updatePlayIcon();
                stopYtTracker();
            }
        }

        function startYtTracker() {
            stopYtTracker();
            ytTrackerInterval = setInterval(() => {
                if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
                    const current = ytPlayer.getCurrentTime();
                    const duration = ytPlayer.getDuration();
                    if(duration > 0) {
                        curTimeEl.innerText = formatTime(current);
                        const percentage = (current / duration) * 100;
                        progressBar.style.width = percentage + '%';
                    }
                }
            }, 500);
        }

        function stopYtTracker() {
            if (ytTrackerInterval) clearInterval(ytTrackerInterval);
        }

        // --- 6. GESTIÓN DE MEDIOS (Carga y Sincronización) ---

        function loadMedia(vid, element) {
            // Actualizar UI
            document.querySelectorAll('.chapter-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            
            // Limpiar estados anteriores
            clearCanvas();
            resetProgress();
            isPlaying = false;
            updatePlayIcon();

            const ytId = extractYouTubeID(vid.src);

            if (ytId) {
                // Es un video de YOUTUBE
                currentMediaType = 'youtube';
                video.classList.add('hidden');
                video.pause();
                ytContainer.classList.remove('hidden');

                if (!isYtReady) {
                    pendingVideoLoad = { videoData: vid, element: element };
                    return;
                }

                if (!ytPlayer) {
                    // Construir el contenedor real que reemplazará la API
                    document.getElementById('yt-player').outerHTML = '<div id="yt-player" class="w-full h-full pointer-events-none"></div>';
                    ytPlayer = new YT.Player('yt-player', {
                        videoId: ytId,
                        width: '100%',
                        height: '100%',
                        playerVars: { 
                            'playsinline': 1, 
                            'controls': 0, // Ocultar controles nativos
                            'rel': 0,
                            'modestbranding': 1,
                            'disablekb': 1
                        },
                        events: { 
                            'onReady': (e) => { 
                                ytPlayer.setVolume(volumeSlider.value);
                                e.target.playVideo(); 
                            }, 
                            'onStateChange': onPlayerStateChange 
                        }
                    });
                } else {
                    ytPlayer.loadVideoById(ytId);
                }
            } else {
                // Es un archivo MP4/Local
                currentMediaType = 'mp4';
                ytContainer.classList.add('hidden');
                if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
                
                video.classList.remove('hidden');
                video.src = vid.src;
                video.volume = volumeSlider.value / 100;
                video.play().then(() => {
                    isPlaying = true;
                    updatePlayIcon();
                }).catch(e => console.log("Autoplay prevent: ", e));
            }
        }

        // --- 7. CONTROLES GENERALES DE REPRODUCCIÓN ---

        function togglePlay() {
            if (currentMediaType === 'mp4') {
                if (video.paused) {
                    video.play();
                    isPlaying = true;
                } else {
                    video.pause();
                    isPlaying = false;
                }
            } else if (currentMediaType === 'youtube' && ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
                const state = ytPlayer.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    ytPlayer.pauseVideo();
                } else {
                    ytPlayer.playVideo();
                }
            }
            updatePlayIcon();
        }

        playBtn.addEventListener('click', togglePlay);

        function updatePlayIcon() {
            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause";
            } else {
                playIcon.className = "fa-solid fa-play";
            }
        }

        // Eventos HTML5 (Sincronización de progreso para MP4)
        video.addEventListener('timeupdate', () => {
            if(currentMediaType !== 'mp4') return;
            const current = video.currentTime;
            const duration = video.duration || 0;
            curTimeEl.innerText = formatTime(current);
            if(duration > 0) {
                const percentage = (current / duration) * 100;
                progressBar.style.width = percentage + '%';
            }
        });

        video.addEventListener('loadedmetadata', () => {
            durTimeEl.innerText = formatTime(video.duration);
        });

        video.addEventListener('play', () => { isPlaying = true; updatePlayIcon(); });
        video.addEventListener('pause', () => { isPlaying = false; updatePlayIcon(); });

        // Evento de Barra de Progreso (Click para Seek)
        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            
            if (currentMediaType === 'mp4') {
                const duration = video.duration;
                if(duration) {
                    video.currentTime = pos * duration;
                }
            } else if (currentMediaType === 'youtube' && ytPlayer) {
                const duration = ytPlayer.getDuration();
                if(duration) {
                    ytPlayer.seekTo(pos * duration, true);
                }
            }
        });

        // Volumen
        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            if(currentMediaType === 'mp4') {
                video.volume = val / 100;
            } else if (currentMediaType === 'youtube' && ytPlayer) {
                ytPlayer.setVolume(val);
            }
        });

        function formatTime(seconds) {
            if(isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function resetProgress() {
            progressBar.style.width = '0%';
            curTimeEl.innerText = '0:00';
            durTimeEl.innerText = '0:00';
        }

        // --- 8. ZOOM Y TRANSFORMACIONES ---
        
        function updateTransform() {
            zoomVal.innerText = currentZoom.toFixed(1) + 'x';
            mediaLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
        }

        zoomSlider.addEventListener('input', (e) => {
            currentZoom = parseFloat(e.target.value);
            updateTransform();
        });

        // Zoom con rueda del ratón (Scroll)
        videoContainer.addEventListener('wheel', (e) => {
            e.preventDefault(); // Prevenir scroll de la página
            const zoomStep = 0.25; // Velocidad de zoom
            
            if (e.deltaY < 0) {
                currentZoom = Math.min(10, currentZoom + zoomStep);
            } else {
                currentZoom = Math.max(1, currentZoom - zoomStep);
            }
            
            zoomSlider.value = currentZoom;
            updateTransform();
        }, { passive: false });

        // --- 9. SISTEMA DE DIBUJO (COMPATIBLE CON ZOOM) ---

        function resizeCanvas() {
            // El canvas iguala su tamaño de dibujo a su tamaño de visualización CSS
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        // Redimensionar inicialmente y cuando cambie la ventana
        window.addEventListener('resize', resizeCanvas);
        // Llamar tras un pequeño delay para asegurar renderizado correcto
        setTimeout(resizeCanvas, 100);

        function setDrawMode(draw, erase) {
            isDrawingMode = draw;
            isErasingMode = erase;
            
            document.body.classList.remove('drawing-active', 'erasing-active');
            drawBtn.classList.remove('active');
            eraseBtn.classList.remove('active');

            if(draw) {
                document.body.classList.add('drawing-active');
                drawBtn.classList.add('active');
            } else if (erase) {
                document.body.classList.add('erasing-active');
                eraseBtn.classList.add('active');
            }
        }

        drawBtn.addEventListener('click', () => setDrawMode(!isDrawingMode, false));
        eraseBtn.addEventListener('click', () => setDrawMode(false, !isErasingMode));
        
        clearBtn.addEventListener('click', clearCanvas);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Obtener coordenadas reales del mouse, compensando el Zoom aplicado al Media Layer
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            // rect.width y rect.height ya están escalados por el CSS transform del padre
            // Multiplicamos por la relación entre el tamaño interno del canvas y el tamaño escalado
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if(isDrawingMode || isErasingMode) {
                isMouseDown = true;
                const pos = getMousePos(e);
                lastX = pos.x;
                lastY = pos.y;
            } else {
                // Iniciar paneo
                isPanning = true;
                document.body.classList.add('panning');
                mediaLayer.style.transition = 'none'; // Desactivar transición para paneo fluido
                lastX = e.clientX - panX;
                lastY = e.clientY - panY;
            }
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            if(isPanning) {
                isPanning = false;
                document.body.classList.remove('panning');
                mediaLayer.style.transition = 'transform 0.2s ease-out'; // Reactivar transición
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if(isPanning) {
                panX = e.clientX - lastX;
                panY = e.clientY - lastY;
                updateTransform();
                return;
            }

            if(!isMouseDown) return;
            
            const pos = getMousePos(e);

            ctx.beginPath();
            
            if(isDrawingMode) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = '#ef4444'; // Color de dibujo (rojo Tailwind)
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            } else if (isErasingMode) {
                // Borra los pixeles donde pase el ratón
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 30; // Grosor del borrador
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }

            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            lastX = pos.x;
            lastY = pos.y;
        });

        // Atajos de Teclado Rápidos
        document.addEventListener('keydown', (e) => {
            // Ignorar atajos si el usuario está escribiendo en algún input (si lo hubiera en el futuro)
            if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const key = e.key.toLowerCase();
            if(key === 'd') setDrawMode(true, false);
            if(key === 'b' || key === 'e') setDrawMode(false, true); // B de Borrar o E de Erase
            if(key === 'c') clearCanvas();
            if(key === ' ' || key === 'k') {
                e.preventDefault();
                togglePlay();
            }
        });

    </script>
</body>
</html>
