<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Profesional de Cursos - YouTube Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f0f0f; font-family: sans-serif; }
        
        /* Transición suave para el zoom y pan */
        #media-layer { transition: transform 0.05s linear; transform-origin: center center; }
        
        /* Contenedores de dibujo superpuestos al video */
        #draw-canvas, #temp-canvas { 
            position: absolute; 
            top:0; left:0; 
            width:100%; height:100%; 
            touch-action: none; 
            pointer-events: none; 
            z-index: 20;
        }
        #temp-canvas { z-index: 21; }

        /* Activar interacción cuando se dibuja (intercepta los clics antes del video) */
        .drawing-active #temp-canvas { pointer-events: auto; cursor: crosshair; }
        
        /* Estilos UI */
        .chapter-item.active { border-left: 4px solid #ef4444; background: rgba(255,255,255,0.1); }
        #sidebar-content h3, #sidebar-content span { color: #ffffff !important; }
        #progress-container { height: 6px; background: #444; cursor: pointer; position: relative; }
        #progress-bar { height: 100%; background: #ef4444; width: 0%; position: absolute; transition: width 0.2s linear; }

        /* Estilos activos para herramientas (Rojo para normales, Cyan para Láser) */
        .tool-active { color: #ef4444; }
        .laser-active { color: #22d3ee; text-shadow: 0 0 8px rgba(34, 211, 238, 0.8); }
    </style>
</head>
<body class="h-screen w-screen flex overflow-hidden">

    <!-- Menú lateral con Materia de YouTube -->
    <div id="sidebar-menu" class="absolute h-full w-[300px] bg-black/95 z-40 transform -translate-x-full transition-transform border-r border-white/10 flex flex-col">
        <div class="p-4 flex justify-between items-center text-white border-b border-white/10">
            <h2 class="font-bold">Materia: FullStack Web</h2>
            <button id="close-sidebar" tabindex="0" class="focus:outline-none focus:text-red-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="sidebar-content" class="flex-1 overflow-y-auto p-2"></div>
    </div>

    <!-- Contenedor principal derecho -->
    <div class="flex-1 flex flex-col h-full relative bg-black overflow-hidden">
        
        <!-- Área exclusiva del Video (Donde funciona el Zoom y Dibujo) -->
        <div id="video-container" class="flex-1 relative flex items-center justify-center overflow-hidden">
            
            <!-- Media Layer -->
            <div id="media-layer" class="w-full h-full flex items-center justify-center relative bg-black">
                
                <!-- Contenedor de YouTube (Añadido ID yt-wrapper para poder darle o quitarle los clics) -->
                <div id="yt-wrapper" class="absolute inset-0 w-full h-full pointer-events-none">
                    <div id="main-video" class="w-full h-full"></div>
                </div>

                <!-- Escudo invisible (z-10) para atrapar clics de Pan/Zoom sin tocar el iframe -->
                <div id="interaction-overlay" class="absolute inset-0 z-10 w-full h-full"></div>
                
                <!-- Lienzos para dibujar encima (z-20 y z-21) -->
                <canvas id="draw-canvas"></canvas>
                <canvas id="temp-canvas"></canvas> 
            </div>

            <!-- Botón del menú -->
            <button id="sidebar-toggle" class="absolute top-4 left-4 text-white text-xl z-50 bg-black/50 p-2 rounded hover:bg-black transition-colors"><i class="fa-solid fa-bars"></i></button>
        </div>

        <!-- Controles Inferiores (Separados físicamente del video) -->
        <div class="w-full bg-[#0a0a0a] z-50 p-4 border-t border-white/10 shrink-0">
            <div class="flex justify-between text-white text-[10px] mb-1 font-mono">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>
            
            <div id="progress-container" class="w-full mb-4 rounded-full overflow-hidden">
                <div id="progress-bar"></div>
            </div>
            
            <div class="flex justify-between items-center text-white">
                <div class="flex items-center gap-4">
                    <button id="play-btn" class="w-6 hover:text-red-400 transition-colors"><i class="fa-solid fa-play"></i></button>
                    
                    <!-- NUEVO: Controles de Volumen -->
                    <div class="flex items-center gap-2 border-l border-white/20 pl-4">
                        <button id="mute-btn" class="hover:text-red-400 transition-colors w-5" title="Silenciar"><i class="fa-solid fa-volume-high"></i></button>
                        <input id="volume-slider" type="range" min="0" max="100" value="100" class="w-20 accent-red-500 cursor-pointer">
                    </div>

                    <span id="zoom-val" class="text-xs w-8 text-gray-400 ml-4">1.0x</span>
                </div>
                
                <div class="flex items-center gap-5 text-lg">
                    <button id="reset-zoom" class="hover:text-red-400 transition-colors" title="Restaurar Zoom"><i class="fa-solid fa-compress"></i></button>
                    <div class="w-px h-5 bg-white/20"></div>
                    
                    <!-- NUEVO: Botones para Mano (Mover) e Interactuar con el iframe de YT -->
                    <button id="pan-mode-btn" class="transition-colors tool-active" title="Mover y Zoom (H)"><i class="fa-solid fa-hand"></i></button>
                    <button id="pointer-mode-btn" class="transition-colors" title="Interactuar / Saltar Anuncios (V)"><i class="fa-solid fa-arrow-pointer"></i></button>
                    <div class="w-px h-5 bg-white/20"></div>
                    
                    <!-- Herramientas de Dibujo -->
                    <button id="draw-mode-btn" class="transition-colors" title="Lápiz (D)"><i class="fa-solid fa-pen"></i></button>
                    <button id="laser-mode-btn" class="transition-colors" title="Puntero Temporal (T)"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
                    <button id="erase-mode-btn" class="transition-colors" title="Borrar (B)"><i class="fa-solid fa-eraser"></i></button>
                    
                    <div class="w-px h-5 bg-white/20"></div>
                    <button id="draw-clear" class="hover:text-red-400 transition-colors" title="Limpiar Todo (C)"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // TEMARIO AMPLIADO CON MÁS VIDEOS Y UNIDADES
        const themes = [
            { name: "Unidad 1: Desarrollo Frontend", videos: [
                { title: "HTML Desde Cero (HolaMundo)", url: "https://www.youtube.com/watch?v=MJkdaVFHrto" },
                { title: "CSS De Principiante a Experto", url: "https://www.youtube.com/watch?v=TlJbu0BMLaY" },
                { title: "Novedades en HTML5", url: "https://youtu.be/hwNoYKhSBh0" },
                { title: "Flexbox y CSS Grid (Midudev)", url: "https://www.youtube.com/watch?v=PofN9-vA2pU" }
            ]},
            { name: "Unidad 2: Programación & Lógica", videos: [
                { title: "Python Desde Cero (Midudev)", url: "https://www.youtube.com/watch?v=TkN2i-_4N4g" },
                { title: "Lógica de Programación", url: "https://www.youtube.com/watch?v=TdITcVD64zI" },
                { title: "JavaScript Desde Cero (Fazt)", url: "https://www.youtube.com/watch?v=RqQ1d1qEWlE" }
            ]},
            { name: "Unidad 3: Frameworks Frontend", videos: [
                { title: "React Curso Completo", url: "https://www.youtube.com/watch?v=7iobxzd_2wY" },
                { title: "Aprende Angular rápido", url: "https://www.youtube.com/watch?v=bOAhE5mQ1oI" },
                { title: "Vue 3 Curso Básico", url: "https://www.youtube.com/watch?v=Bq0Hq_Rz-1k" }
            ]},
            { name: "Unidad 4: Backend y Bases de Datos", videos: [
                { title: "Node.js y Express", url: "https://www.youtube.com/watch?v=yB4nWAZeVNM" },
                { title: "SQL vs NoSQL", url: "https://www.youtube.com/watch?v=cQjxEpIGy9s" },
                { title: "Curso de MongoDB", url: "https://www.youtube.com/watch?v=lWMemPN9t6Q" }
            ]}
        ];

        function extractYTId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const canvas = document.getElementById('draw-canvas');
        const tempCanvas = document.getElementById('temp-canvas');
        const ctx = canvas.getContext('2d');
        const tempCtx = tempCanvas.getContext('2d');
        const mediaLayer = document.getElementById('media-layer');
        const videoContainer = document.getElementById('video-container');
        const progressBar = document.getElementById('progress-bar');
        
        let currentZoom = 1;
        let currentTool = null; // 'pan' (null), 'pointer', 'pen', 'eraser', 'temporal'
        
        let panX = 0, panY = 0, isDragging = false, startPanX = 0, startPanY = 0;

        let ytPlayer = null;
        let isPlayerReady = false;
        let progressInterval = null;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            const firstVideoId = extractYTId(themes[0].videos[0].url);
            
            ytPlayer = new YT.Player('main-video', {
                videoId: firstVideoId,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,     
                    'disablekb': 1,    
                    'rel': 0,
                    'modestbranding': 1,
                    'vq': 'hd1080' // Parámetro extra para sugerir HD desde el inicio
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        };

        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('mute-btn');

        function onPlayerReady(event) {
            isPlayerReady = true;
            document.getElementById('total-duration').textContent = formatTime(ytPlayer.getDuration());
            
            // Sugerir máxima resolución apenas el reproductor esté listo
            ytPlayer.setPlaybackQuality('highres');
            
            // Inicializar volumen
            const vol = ytPlayer.getVolume();
            volumeSlider.value = vol;
            updateMuteIcon(ytPlayer.isMuted() || vol === 0);
        }

        function updateMuteIcon(isMuted) {
            muteBtn.innerHTML = isMuted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
        }

        volumeSlider.addEventListener('input', (e) => {
            if (!isPlayerReady) return;
            const vol = parseInt(e.target.value);
            ytPlayer.setVolume(vol);
            if(ytPlayer.isMuted() && vol > 0) ytPlayer.unMute();
            updateMuteIcon(vol === 0);
        });

        muteBtn.addEventListener('click', () => {
            if (!isPlayerReady) return;
            if (ytPlayer.isMuted() || ytPlayer.getVolume() === 0) {
                ytPlayer.unMute();
                let vol = parseInt(volumeSlider.value);
                if (vol === 0) { vol = 100; volumeSlider.value = 100; }
                ytPlayer.setVolume(vol);
                updateMuteIcon(false);
            } else {
                ytPlayer.mute();
                volumeSlider.value = 0;
                updateMuteIcon(true);
            }
        });

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                // Reforzar la calidad máxima cada vez que se le da a Play
                event.target.setPlaybackQuality('highres');
                
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
                document.getElementById('total-duration').textContent = formatTime(ytPlayer.getDuration());
                progressInterval = setInterval(updateProgressBar, 500);
            } else {
                document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i>';
                clearInterval(progressInterval);
            }
        }

        function updateProgressBar() {
            if(!isPlayerReady) return;
            const dur = ytPlayer.getDuration();
            const cur = ytPlayer.getCurrentTime();
            if(dur > 0) {
                progressBar.style.width = ((cur / dur) * 100) + "%";
                document.getElementById('current-time').textContent = formatTime(cur);
            }
        }

        function formatTime(s) {
            if (isNaN(s)) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function togglePlay() {
            if (!isPlayerReady) return;
            if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        document.getElementById('progress-container').onclick = (e) => {
            if (!isPlayerReady) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const seekTime = ((e.clientX - rect.left) / rect.width) * ytPlayer.getDuration();
            ytPlayer.seekTo(seekTime, true);
            updateProgressBar();
        };

        const sidebarContent = document.getElementById('sidebar-content');
        themes.forEach(t => {
            const header = document.createElement('h3');
            header.className = "text-xs p-2 font-bold mt-2 text-gray-400 uppercase";
            header.textContent = t.name;
            sidebarContent.appendChild(header);
            
            t.videos.forEach(v => {
                const vidId = extractYTId(v.url);
                const posterUrl = `https://img.youtube.com/vi/${vidId}/hqdefault.jpg`;
                
                const el = document.createElement('div');
                el.tabIndex = 0; 
                el.className = "flex gap-3 p-2 mb-1 cursor-pointer chapter-item hover:bg-white/10 focus:bg-white/20 focus:outline-none items-center rounded-lg transition-colors";
                el.innerHTML = `<img src="${posterUrl}" class="w-16 h-10 object-cover rounded shadow">
                                <span class="text-sm">${v.title}</span>`;
                
                const loadVideo = () => {
                    if (isPlayerReady) {
                        // Cambiamos loadVideoById simple por un objeto que exige 'highres'
                        ytPlayer.loadVideoById({
                            videoId: vidId,
                            suggestedQuality: 'highres' 
                        });
                    }
                    document.getElementById('sidebar-menu').classList.add('-translate-x-full'); 
                    document.querySelectorAll('.chapter-item').forEach(i => i.classList.remove('active')); 
                    el.classList.add('active'); 
                    document.activeElement.blur();
                };

                el.onclick = loadVideo;
                el.onkeydown = (e) => {
                    if (e.key === 'Enter') loadVideo();
                };

                sidebarContent.appendChild(el);
            });
        });

        function setTool(tool) {
            if (currentTool === tool) {
                currentTool = null; // null es el modo Mano (Pan/Zoom) por defecto
            } else {
                currentTool = tool;
            }

            // Limpiar UI general
            document.body.classList.remove('drawing-active');
            document.getElementById('pan-mode-btn').classList.remove('tool-active');
            document.getElementById('pointer-mode-btn').classList.remove('tool-active');
            document.getElementById('draw-mode-btn').classList.remove('tool-active');
            document.getElementById('erase-mode-btn').classList.remove('tool-active');
            document.getElementById('laser-mode-btn').classList.remove('laser-active');

            const ytWrapper = document.getElementById('yt-wrapper');
            const interactionOverlay = document.getElementById('interaction-overlay');

            // Si es Puntero (Interactuar con Youtube)
            if (currentTool === 'pointer') {
                document.getElementById('pointer-mode-btn').classList.add('tool-active');
                ytWrapper.classList.remove('pointer-events-none');
                interactionOverlay.classList.add('pointer-events-none');
            } else {
                // Si es cualquier otra herramienta, bloqueamos los clics de youtube para poder dibujar/mover
                ytWrapper.classList.add('pointer-events-none');
                interactionOverlay.classList.remove('pointer-events-none');
                
                if (currentTool === 'pen') {
                    document.body.classList.add('drawing-active');
                    document.getElementById('draw-mode-btn').classList.add('tool-active');
                } else if (currentTool === 'eraser') {
                    document.body.classList.add('drawing-active');
                    document.getElementById('erase-mode-btn').classList.add('tool-active');
                } else if (currentTool === 'temporal') {
                    document.body.classList.add('drawing-active');
                    document.getElementById('laser-mode-btn').classList.add('laser-active');
                } else if (currentTool === null) {
                    document.getElementById('pan-mode-btn').classList.add('tool-active');
                }
            }
            updateCursor();
        }

        // Inicializa el botón de pan activado al cargar la página
        setTool(null); 

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            switch(e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowRight': if(isPlayerReady) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 5, true); break;
                case 'ArrowLeft': if(isPlayerReady) ytPlayer.seekTo(ytPlayer.getCurrentTime() - 5, true); break;
                case 'KeyH': setTool(null); break; // Pan (Mano)
                case 'KeyV': setTool('pointer'); break; // Interactuar
                case 'KeyD': setTool('pen'); break;
                case 'KeyB': setTool('eraser'); break;
                case 'KeyT': setTool('temporal'); break;
                case 'KeyC': clearCanvases(); break;
                case 'KeyQ': 
                    const menu = document.getElementById('sidebar-menu');
                    menu.classList.toggle('-translate-x-full'); 
                    if (!menu.classList.contains('-translate-x-full')) {
                        setTimeout(() => {
                            const firstItem = document.querySelector('.chapter-item');
                            if(firstItem) firstItem.focus();
                        }, 100);
                    } else {
                        document.activeElement.blur();
                    }
                    break;
            }
        });

        videoContainer.addEventListener('wheel', (e) => {
            // Permitir zoom incluso si estamos en modo interactivo, mientras se mueva la rueda sobre el contenedor principal
            e.preventDefault();
            const zoomAmount = e.deltaY > 0 ? -0.2 : 0.2;
            const newZoom = Math.min(Math.max(currentZoom + zoomAmount, 1), 10);

            if (newZoom !== currentZoom) {
                const rect = videoContainer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                panX = mouseX - (mouseX - panX) * (newZoom / currentZoom);
                panY = mouseY - (mouseY - panY) * (newZoom / currentZoom);
                
                currentZoom = newZoom;
                if (currentZoom === 1) { panX = 0; panY = 0; }
                applyTransform();
            }
        }, { passive: false });
        
        videoContainer.addEventListener('mousedown', (e) => {
            // Solo iniciar paneo si estamos estrictamente en el modo Hand (null) y hay zoom
            if (currentTool === null && currentZoom > 1) {
                isDragging = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
                updateCursor();
            }
        });
        
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                applyTransform();
            }
        });

        function applyTransform() {
            mediaLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
            mediaLayer.style.transformOrigin = '0 0';
            document.getElementById('zoom-val').textContent = currentZoom.toFixed(1) + "x";
            updateCursor();
        }
        
        function updateCursor() {
            if (currentTool === 'pointer') {
                videoContainer.style.cursor = 'default';
            } else if (currentTool === 'pen' || currentTool === 'eraser' || currentTool === 'temporal') {
                videoContainer.style.cursor = 'default';
            } else {
                videoContainer.style.cursor = isDragging ? 'grabbing' : (currentZoom > 1 ? 'grab' : 'default');
            }
        }

        let drawing = false;
        let lastX = 0, lastY = 0;

        tempCanvas.onmousedown = (e) => {
            if (!currentTool || currentTool === 'pointer') return;
            e.stopPropagation();
            drawing = true; 
            
            const rect = tempCanvas.getBoundingClientRect();
            lastX = (e.clientX - rect.left) / currentZoom;
            lastY = (e.clientY - rect.top) / currentZoom;
        };

        window.addEventListener('mouseup', () => { 
            if (drawing) {
                drawing = false; 
                ctx.beginPath(); 
                tempCtx.beginPath();
            }
            if (isDragging) {
                isDragging = false;
                updateCursor();
            }
        });

        tempCanvas.onmousemove = (e) => {
            if(!drawing || !currentTool || currentTool === 'pointer') return;
            
            const rect = tempCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / currentZoom;
            const y = (e.clientY - rect.top) / currentZoom;
            
            const activeCtx = currentTool === 'temporal' ? tempCtx : ctx;
            activeCtx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : 'source-over';
            
            activeCtx.lineWidth = (currentTool === 'eraser' ? 50 : 10) / currentZoom;
            activeCtx.lineCap = 'round';
            activeCtx.lineJoin = 'round';
            activeCtx.strokeStyle = currentTool === 'temporal' ? "#22d3ee" : "#ef4444";
            
            activeCtx.beginPath();
            activeCtx.moveTo(lastX, lastY);
            activeCtx.lineTo(x, y);
            activeCtx.stroke();
            
            lastX = x;
            lastY = y;
        };

        function fadeTemporalCanvas() {
            tempCtx.globalCompositeOperation = 'destination-out';
            tempCtx.fillStyle = 'rgba(0, 0, 0, 0.015)'; 
            tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            requestAnimationFrame(fadeTemporalCanvas);
        }
        fadeTemporalCanvas();

        function clearCanvases() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        }

        document.getElementById('pan-mode-btn').onclick = () => setTool(null);
        document.getElementById('pointer-mode-btn').onclick = () => setTool('pointer');
        document.getElementById('draw-mode-btn').onclick = () => setTool('pen');
        document.getElementById('erase-mode-btn').onclick = () => setTool('eraser');
        document.getElementById('laser-mode-btn').onclick = () => setTool('temporal');
        document.getElementById('draw-clear').onclick = clearCanvases;
        document.getElementById('play-btn').onclick = togglePlay;
        
        document.getElementById('reset-zoom').onclick = () => {
            currentZoom = 1; panX = 0; panY = 0; applyTransform();
        };
        
        document.getElementById('sidebar-toggle').onclick = () => {
            document.getElementById('sidebar-menu').classList.remove('-translate-x-full');
            setTimeout(() => {
                const firstItem = document.querySelector('.chapter-item');
                if(firstItem) firstItem.focus();
            }, 100);
        };

        document.getElementById('close-sidebar').onclick = () => document.getElementById('sidebar-menu').classList.add('-translate-x-full');
        document.getElementById('close-sidebar').onkeydown = (e) => {
            if (e.key === 'Enter') document.getElementById('sidebar-menu').classList.add('-translate-x-full');
        };
        
        function setupCanvas() { 
            canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; 
            tempCanvas.width = tempCanvas.offsetWidth; tempCanvas.height = tempCanvas.offsetHeight;
        }
        window.addEventListener('resize', setupCanvas);
        setupCanvas();
    </script>
</body>
</html>
